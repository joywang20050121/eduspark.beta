name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            e2e/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install browser test dependencies
        run: npm ci --prefix e2e

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Check Functions types
        run: npm --prefix functions run check

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Run emulator and browser tests
        run: >-
          ./functions/node_modules/.bin/firebase emulators:exec
          --project demo-eduspark
          --only auth,functions,firestore,hosting
          "npm --prefix functions run test:functions:run &&
          npm --prefix functions test &&
          npm --prefix e2e test"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://coespark-a3f6e.web.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COESPARK_A3F6E }}

      - name: Deploy to Firebase production
        run: >-
          ./functions/node_modules/.bin/firebase deploy
          --project coespark-a3f6e
          --only functions,firestore,hosting
          --non-interactive

      - name: Verify production site
        run: >-
          curl --fail --silent --show-error
          --retry 5 --retry-delay 5
          https://coespark-a3f6e.web.app/
