name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            e2e/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install browser test dependencies
        run: npm ci --prefix e2e

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://coespark-a3f6e.web.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COESPARK_A3F6E }}

      - name: Deploy Firestore and Hosting
        run: >-
          ./functions/node_modules/.bin/firebase deploy
          --project coespark-a3f6e
          --only firestore,hosting
          --non-interactive

      - name: Deploy Functions batch 1
        run: >-
          node scripts/deploy-functions-with-retry.mjs
          getMyProfile,bootstrapSuperAdmin,saveProfile,createWish,listWishes,deleteWish

      - name: Allow previous revisions to scale down
        run: sleep 60

      - name: Deploy Functions batch 2
        run: >-
          node scripts/deploy-functions-with-retry.mjs
          listPublishedAnnouncements,listAnnouncements,saveAnnouncement,deleteAnnouncement,redeemReward,redeemQr

      - name: Allow previous revisions to scale down
        run: sleep 60

      - name: Deploy Functions batch 3
        run: >-
          node scripts/deploy-functions-with-retry.mjs
          createQrCampaign,updateQrCampaign,listQrCampaigns,listPublicQrCampaigns,getQrCampaign,setQrCampaignStatus,lookupAdminUser

      - name: Allow previous revisions to scale down
        run: sleep 60

      - name: Deploy Functions batch 4
        run: >-
          node scripts/deploy-functions-with-retry.mjs
          listAdminUsers,listUsers,batchAddPoints,getDailyCheckIns,submitDailyCheckIn,getPointHistory,getUserPointHistory,setAdminRole

      - name: Verify production site
        run: >-
          curl --fail --silent --show-error
          --retry 5 --retry-delay 5
          https://coespark-a3f6e.web.app/
